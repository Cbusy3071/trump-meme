<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trump DM parody</title><style>/* Layout concept: one fixed shell = the visible viewport; header / thread / composer are flex children.
   Single deliberate dark look (messaging dark mode), so no light-theme blocks. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --fg: #f5f5f5;
  --muted: #a8a8a8;
  --faint: #737373;
  --line: #1c1c1e;
  --bubble-in: #262626;
  --pill: #262626;
  --accent: #3797f0;
  --out: linear-gradient(160deg, #7b3cf5 0%, #4f58f8 52%, #2c86f7 100%);
  --chart-bg: #0d0f12;
  --chart-edge: #23262b;
  --chart-grid: rgba(255, 255, 255, 0.07);
  --chart-label: #8b9099;
  --chart-tag-fg: #03160a;
  --up: #22c55e;
  --down: #ef4444;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--fg);
}
body {
  /* Document can't scroll, so iOS pans the visual viewport instead of the page. */
  position: fixed;
  inset: 0;
  width: 100%;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* The only element that knows about the keyboard. Height and offset come from
   visualViewport (see viewport.ts); 100% is the pre-JS fallback. */
.shell {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--app-h, 100%);
  transform: translate3d(0, var(--app-top, 0px), 0);
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.35 var(--font);
  overflow: hidden;
  contain: strict;
}
.frame {
  position: relative;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
@media (min-width: 600px) {
  .frame {
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.icon-btn {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  color: var(--fg);
  flex: none;
}
.icon-btn.sm {
  width: 34px;
  height: 34px;
}
.tnum {
  font-variant-numeric: tabular-nums;
}
.avatar {
  display: block;
  border-radius: 50%;
  flex: none;
}

/* ---------- Header */
.hdr {
  flex: none;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: calc(var(--sat) + 4px) max(8px, var(--sar)) 6px max(2px, var(--sal));
  border-bottom: 0.5px solid var(--line);
  background: var(--bg);
  position: relative;
  z-index: 2;
}
.hdr-back {
  margin-right: 2px;
}
.hdr-id {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hdr-text {
  min-width: 0;
}
.hdr-name {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hdr-sub {
  font-size: 12px;
  color: #d4d4d4;
  line-height: 1.3;
}

/* ---------- Thread */
.thread {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.thread-inner {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 8px max(12px, var(--sar)) 10px max(10px, var(--sal));
  box-sizing: border-box;
}
.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 3px;
  padding: 28px 0 12px;
}
.intro .avatar {
  margin-bottom: 8px;
}
.intro-name {
  font-size: 20px;
  font-weight: 700;
}
.intro-sub {
  font-size: 14px;
  color: var(--muted);
}
.intro-btn {
  margin-top: 12px;
  padding: 7px 14px;
  border-radius: 8px;
  background: var(--pill);
  font-size: 14px;
  font-weight: 600;
}
.sep {
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
  margin: 18px 0 8px;
}
.row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-top: 2px;
}
.row.group-start {
  margin-top: 8px;
}
.sep + .row {
  margin-top: 0;
}
.row.me {
  justify-content: flex-end;
}
.av-slot {
  width: 28px;
  height: 28px;
  flex: none;
}
.bubble {
  max-width: min(75%, 360px);
  padding: 8px 12px;
  border-radius: 22px;
  font-size: 15.5px;
  line-height: 1.33;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: normal;
  min-width: 0;
}
.them .bubble {
  background: var(--bubble-in);
}
.me .bubble {
  background: var(--out);
  color: #fff;
}
/* Grouped corners: tight on the sender's side between stacked bubbles. */
.them:not(.group-start) .bubble {
  border-top-left-radius: 6px;
}
.them:not(.group-end) .bubble {
  border-bottom-left-radius: 6px;
}
.me:not(.group-start) .bubble {
  border-top-right-radius: 6px;
}
.me:not(.group-end) .bubble {
  border-bottom-right-radius: 6px;
}
.seen {
  align-self: flex-end;
  font-size: 12px;
  color: var(--faint);
  margin: 4px 4px 0 0;
}
.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 12px 14px;
}
.typing i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #8e8e8e;
  animation: blink 1.2s infinite ease-in-out;
}
.typing i:nth-child(2) {
  animation-delay: 0.16s;
}
.typing i:nth-child(3) {
  animation-delay: 0.32s;
}
@keyframes blink {
  0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-2px); }
}

/* ---------- Chart card in thread */
.chart-card {
  display: block;
  width: min(250px, 72vw);
  border-radius: 18px;
  overflow: hidden;
  background: var(--chart-bg);
  border: 0.5px solid var(--chart-edge);
  text-align: left;
  transition: transform 120ms ease;
}
.chart-card:active {
  transform: scale(0.98);
}
.chart-card .chart-svg {
  display: block;
}
.chart-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px 6px;
}
.chart-sym,
.chart-px {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.chart-px {
  align-items: flex-end;
  font-weight: 600;
  font-size: 14px;
}
.chart-ticker {
  font-weight: 700;
  font-size: 14px;
}
.chart-name {
  font-size: 11px;
  color: var(--chart-label);
}
.chart-chg {
  font-size: 12px;
  color: var(--up);
}
.chart-foot {
  font-size: 11px;
  color: var(--faint);
  padding: 6px 12px 10px;
}

/* ---------- Expanded chart */
.sheet {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--sat) + 12px) max(12px, var(--sar)) calc(var(--sab) + 12px) max(12px, var(--sal));
  background: rgba(0, 0, 0, 0);
  transition: background-color 220ms ease;
}
.sheet.is-in {
  background: rgba(0, 0, 0, 0.78);
}
.sheet-card {
  width: 100%;
  max-width: 520px;
  height: min(660px, 100%);
  display: flex;
  flex-direction: column;
  background: var(--chart-bg);
  border: 0.5px solid var(--chart-edge);
  border-radius: 20px;
  overflow: hidden;
  opacity: 0;
  transform: translateY(28px) scale(0.96);
  transition: transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 200ms ease;
}
.sheet.is-in .sheet-card {
  opacity: 1;
  transform: none;
}
.sheet-top {
  display: flex;
  align-items: flex-start;
  padding: 6px 6px 0 4px;
}
.sheet-top .chart-head {
  flex: 1;
  padding: 12px 12px 8px;
}
.chart-head--lg .chart-ticker {
  font-size: 20px;
}
.chart-head--lg .chart-name {
  font-size: 12px;
}
.chart-head--lg .chart-px {
  font-size: 20px;
}
.chart-head--lg .chart-chg {
  font-size: 14px;
}
.sheet-x {
  width: 44px;
  height: 44px;
  background: rgba(255, 255, 255, 0.08);
}
.sheet-chart {
  flex: 1;
  min-height: 0;
  padding: 4px 6px 0;
}
.sheet-chart .chart-svg {
  display: block;
  width: 100%;
  height: 100%;
}
.sheet-foot {
  font-size: 12px;
  color: var(--faint);
  padding: 10px 16px 14px;
}

/* ---------- Composer */
.composer {
  flex: none;
  margin: 0;
  padding: 6px max(10px, var(--sar)) calc(8px + var(--sab)) max(10px, var(--sal));
  background: var(--bg);
}
/* Keyboard up: the home-indicator inset is under the keyboard, so drop it. */
:root[data-kb] .composer {
  padding-bottom: 8px;
}
.pill {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 4px 6px 4px 4px;
  border-radius: 24px;
  background: var(--pill);
  box-sizing: border-box;
}
.cam {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  flex: none;
}
.input {
  flex: 1;
  min-width: 0;
  height: 36px;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--fg);
  font: 16px/1.25 var(--font); /* 16px or iOS zooms on focus */
  padding: 0 4px;
  caret-color: var(--accent);
}
.input::placeholder {
  color: var(--muted);
}
.tools {
  display: flex;
  align-items: center;
  flex: none;
}
.send {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  flex: none;
}

@media (prefers-reduced-motion: reduce) {
  .sheet,
  .sheet-card,
  .chart-card {
    transition: none;
  }
  .typing i {
    animation-duration: 2.4s;
  }
}

/* Scene styling — original layout and bubble styling preserved. */
.hdr-name{display:flex;align-items:center;gap:5px}
.verify{display:inline-grid;place-items:center;background:#3897f0;color:white;font-size:10px;font-weight:900;width:15px;height:15px;border-radius:50%}
.hdr .hdr-sub{max-width:280px}
.avatar-art{object-fit:cover;overflow:hidden}
.chart-card{cursor:pointer}
.chart-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chart-card svg{display:block;width:100%;height:auto}
.chart-foot{font-size:10px}
.thread{scroll-behavior:auto}
.thread-inner{justify-content:flex-start;min-height:100%}
.thread-inner .intro{flex:none}
.row{flex:none}
.sep{flex:none}
.composer .tools{gap:8px}
.send[disabled]{opacity:.65;cursor:default}
.sheet{visibility:hidden;pointer-events:none}
.sheet.is-in{visibility:visible;pointer-events:auto}
.sheet-card{max-height:80vh}
@media(max-width:380px){.hdr-id{gap:7px}}
/* Inline playable voice note, styled to match the existing incoming DMs. */
.voice-bubble{background:var(--bubble-in);border-radius:20px 20px 20px 6px;padding:10px 12px;max-width:min(85vw,310px);min-width:min(67vw,250px);box-sizing:border-box}
.voice-top{display:flex;align-items:center;gap:10px}
.voice-play{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:50%;color:#fff;background:#3897f0;font-size:17px;font-weight:700}
.voice-play:focus-visible,.voice-scrub:focus-visible{outline:2px solid white;outline-offset:3px}
.voice-main{min-width:0;flex:1}
.voice-title{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.voice-wave{display:flex;align-items:center;gap:2px;height:18px;overflow:hidden;margin-top:3px}
.voice-wave i{display:block;flex:1;min-width:2px;max-width:4px;border-radius:2px;background:#8e8e93;height:var(--h)}
.voice-wave i.is-played{background:#59aaff}
.voice-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.voice-time{font-size:11px;color:#b4b4b9;white-space:nowrap;font-variant-numeric:tabular-nums}
.voice-scrub{width:100%;margin:0;accent-color:#3897f0;height:12px;min-width:0;cursor:pointer}
.typing-entry{animation:typing-enter .17s ease-out both}

@keyframes typing-enter{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style></head><body>

  // Replies are deterministic and simulated: not a live account.
  const replies = [
    'Listen very carefully.',
    'It is going to be tremendous. Believe me.',
    'You need to stay focused. Very focused.',
    'Nobody understands the markets like me.',
  ];
  function chooseReply(text){
    const s=text.toLowerCase();
    if(/funded|account|challenge/.test(s))return 'Listen very carefully. You can do this.';
    if(/voice|audio/.test(s))return 'Play the voice message above.';
    return replies[(replyNo++)%replies.length];
  }
  function replyTo(text){
    replyPending=true;
    const row=document.createElement('div');row.className='row them group-start group-end';row.id='typing-row';

    nextReplyTimer=setTimeout(()=>{
      row.remove();addMessage('them',chooseReply(text));replyPending=false;

  document.getElementById('composer').addEventListener('submit',(e)=>{
    e.preventDefault();const text=input.value.trim();if(!text)return;
    // Manual input takes over the conversation rather than interleaving with the scripted scene.
    if(sceneRunning){sceneGeneration++;sceneRunning=false;clearTyping();sceneComplete();}
    input.value='';addMessage('me',text);

  function openChart(){modal.classList.add('is-in');document.getElementById('chart-close').focus();}
  function closeChart(){modal.classList.remove('is-in');}
  document.getElementById('chart-close').addEventListener('click',closeChart);
  modal.addEventListener('click',(e)=>{if(e.target===modal)closeChart()});
  document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeChart()});

  document.getElementById('camera').addEventListener('click',()=>{input.value="Trump daddy I need your help, I'm about to loose the funded.";input.focus();});
  document.querySelector('.hdr-back').addEventListener('click',()=>{thread.scrollTo({top:0,behavior:'smooth'});});
  // Keep the same fixed shell and composer behaviour when the mobile keyboard opens.
  const vv=window.visualViewport;
  function viewport(){
    if(!vv)return;
    const h=Math.round(vv.height), top=Math.round(vv.offsetTop);

  }
